    <style>
      /* Branded intro splash — static so it paints before the JS bundle loads. */
      #intro-splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px;background:#0F0F0F url(/splash-bg-mobile.webp) center/cover no-repeat;transition:opacity .5s ease-in;}
      @media (min-width:768px){#intro-splash{background-image:url(/splash-bg-desktop-v2.webp)}}
      #intro-splash.intro-splash--out{opacity:0;pointer-events:none}
      #intro-splash img{width:230px;height:auto}
      @media (min-width:768px){#intro-splash img{width:300px}}
      #intro-splash p{margin:0 0 44px;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#F2F3F5;text-align:center;font-size:2.1rem;line-height:1.22}
      @media (min-width:768px){#intro-splash p{font-size:3.5rem}}
      @keyframes splash-line-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
      #intro-splash p span{display:block;animation:splash-line-in .45s ease-out both}
      @media (min-width:768px){#intro-splash p span{display:inline-block}}
      #intro-splash p span:nth-child(1){animation-delay:.15s}
      #intro-splash p span:nth-child(2){animation-delay:.55s}
      #intro-splash p span:nth-child(3){animation-delay:.95s}
      #intro-splash .splash-orange{color:#E85D26}
    </style>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9YFQ865HBJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9YFQ865HBJ');
    </script>
  </head>
  <body style="background-color: #0F0F0F;">
    <div id="intro-splash" aria-hidden="true">
      <p>
        <span>Your Website.</span>
        <span>Your Reputation.</span>
        <span class="splash-orange">Elevated.</span>
      </p>
      <img src="/logo-horizontal.png" alt="" width="1280" height="261" fetchpriority="high" decoding="sync">
    </div>
    <script>
      (function () {
        var el = document.getElementById("intro-splash");
        if (!el) return;
        var show = false;
        try {
          if (
            !navigator.webdriver &&
            !window.matchMedia("(prefers-reduced-motion: reduce)").matches &&
            window.sessionStorage.getItem("graylock-intro-shown") !== "1"
          ) {
            window.sessionStorage.setItem("graylock-intro-shown", "1");
            show = true;
          }
        } catch (e) {
          show = false;
        }
        if (!show) {
          el.parentNode.removeChild(el);
          return;
        }
        document.documentElement.style.overflow = "hidden";
        // Release the scroll lock while the overlay is still fully opaque so
        // the scrollbar's layout shift happens invisibly behind it.
        window.setTimeout(function () {
          document.documentElement.style.overflow = "";
        }, 2100);
        window.setTimeout(function () {
          el.classList.add("intro-splash--out");
        }, 2250);
        window.setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 2800);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
